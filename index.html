<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naoki Takehara | ホーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6750a4;
        --on-primary: #fff;
        --surface: #fffbfe;
        --surface-container: #f3edf7;
        --surface-container-high: #ece6f0;
        --on-surface: #1c1b1f;
        --outline: #79747e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
        background: var(--surface);
        color: var(--on-surface);
      }
      .top-app-bar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: color-mix(in srgb, var(--surface) 90%, white);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid #e0dfe3;
        padding: 0.8rem 1.2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .brand { margin: 0; font-size: 1.2rem; }
      .nav-links { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .nav-link {
        text-decoration: none;
        color: var(--on-surface);
        background: var(--surface-container);
        padding: 0.55rem 0.9rem;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-weight: 500;
      }
      .nav-link.active {
        background: var(--primary);
        color: var(--on-primary);
      }
      .container { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
      .hero {
        background: var(--surface-container);
        border: 1px solid #e6e1e5;
        border-radius: 24px;
        padding: 1.5rem;
      }
      .hero h2 { margin: 0 0 0.6rem; font-size: 1.5rem; }
      .hero p { margin: 0.35rem 0; line-height: 1.7; }
      .cta-row { margin-top: 1rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
      .cta {
        text-decoration: none;
        border-radius: 10px;
        padding: 0.55rem 0.9rem;
        background: var(--surface-container-high);
        color: var(--on-surface);
      }
      .material-symbols-outlined { font-size: 1.15rem; }
    </style>
  </head>
  <body>
    <header class="top-app-bar">
      <h1 class="brand">Naoki Takehara</h1>
      <nav class="nav-links" aria-label="ページナビゲーション">
        <a class="nav-link active" href="index.html"><span class="material-symbols-outlined">home</span>ホーム</a>
        <a class="nav-link" href="about.html"><span class="material-symbols-outlined">person</span>私について</a>
        <a class="nav-link" href="research.html"><span class="material-symbols-outlined">science</span>リサーチ</a>
        <a class="nav-link" href="blog.html"><span class="material-symbols-outlined">article</span>ブログ</a>
      </nav>
    </header>

    <main class="container">
      <section class="hero">
        <h2>ホーム</h2>
        <p>このホームページは、ホーム（デフォルト）から各ページへ遷移する形式に刷新しました。</p>
        <p>ナビゲーションバーから「私について」「リサーチ」「ブログ」へ移動できます。</p>
        <div class="cta-row">
          <a class="cta" href="about.html">私についてを見る</a>
          <a class="cta" href="research.html">リサーチを見る</a>
          <a class="cta" href="blog.html">ブログを見る</a>
        </div>
      </section>
    </main>
  </body>
</html>
