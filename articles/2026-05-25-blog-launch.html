<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ブログページ開設のご案内 | Naoki Takehara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #6750a4;
        --on-primary: #ffffff;
        --surface: #fffbfe;
        --surface-container: #f3edf7;
        --on-surface: #1c1b1f;
        --on-surface-variant: #49454f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans JP", system-ui, sans-serif;
        background: var(--surface);
        color: var(--on-surface);
      }
      .top-app-bar {
        position: sticky;
        top: 0;
        background: var(--surface);
        border-bottom: 1px solid #e0dfe3;
        padding: 0.8rem 1.2rem;
      }
      .top-app-bar a {
        text-decoration: none;
        color: var(--primary);
        font-weight: 700;
      }
      .container { max-width: 760px; margin: 0 auto; padding: 1.5rem; }
      .article-card {
        background: var(--surface-container);
        border: 1px solid #e6e1e5;
        border-radius: 24px;
        padding: 1.5rem;
      }
      .publish-date {
        color: var(--on-surface-variant);
        margin-bottom: 0.6rem;
      }
      p { line-height: 1.75; }
    </style>
  </head>
  <body>
    <header class="top-app-bar">
      <a href="../blog.html" aria-label="ブログ一覧へ戻る">← ブログ一覧に戻る</a>
    </header>
    <main class="container">
      <article class="article-card">
        <div class="publish-date">公開日: 2026-05-25</div>
        <h1>ブログページ開設のご案内</h1>
        <p>
          このたび、Webサイト内にブログページを開設しました。今後は研究や開発の記録、
          学びのメモなどを記事として更新していきます。
        </p>
        <p>
          ブログ一覧ページでは、公開日の新しい順に記事を表示しています。
          ご興味のあるタイトルをタップしてご覧ください。
        </p>
      </article>
    </main>
  </body>
</html>
